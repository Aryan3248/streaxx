        : { text: lr ? 'Delayed' : 'Starting', fg: '#B45309', bg: 'rgba(217,119,6,0.08)', bd: 'rgba(217,119,6,0.3)', dot: '#B45309', cls: '' };
      statusLine = 'Tracking ' + ov.totals.wallets + ' wallets of ' + ov.totals.casinos + ' casinos. ' + (lr ? 'Last read ' + this.ago(lr.at) + ', every ' + stt.pollMinutes + ' min.' : 'First read is running.');
      if (!stt.keys.etherscan) notice = { title: 'Add an Etherscan API key to start counting flows', body: 'Balances are read already. Deposits and withdrawals need a free key from etherscan.io set as ETHERSCAN_API_KEY on the server.' };
      else if (!lr) notice = { title: 'First read in progress', body: 'The server is reading the last 48 hours of every tracked wallet. Numbers fill in over the next few minutes.' };
    }

    // KPIs
    var t = ok ? ov.totals : null;
    var kpis = [
      { label: 'Deposits ' + st.win, value: t ? this.money(t.inflow) : 'Waiting', sub: t ? t.txIn.toLocaleString('en-US') + (t.txIn === 1 ? ' transfer in' : ' transfers in') : 'Into tracked casino wallets', color: t ? green : '#74748A' },
      { label: 'Withdrawals ' + st.win, value: t ? this.money(t.outflow) : 'Waiting', sub: t ? t.txOut.toLocaleString('en-US') + (t.txOut === 1 ? ' transfer out' : ' transfers out') : 'Paid out to players', color: t ? orange : '#74748A' },
      { label: 'Net flow ' + st.win, value: t ? (t.net >= 0 ? '+' : '') + this.money(t.net) : 'Waiting', sub: t ? (t.net >= 0 ? 'More came in than went out' : 'More went out than came in') : 'Deposits minus withdrawals', color: t ? (t.net >= 0 ? green : orange) : '#74748A' },
      { label: 'Wallet balances', value: t ? this.money(t.balance) : 'Waiting', sub: t ? t.whales24h + (t.whales24h === 1 ? ' whale move in 24h' : ' whale moves in 24h') : 'Held in tracked wallets', color: t ? '#16141F' : '#74748A' }
    ];

    // hourly chart
    var hourly = ok ? ov.hourly : [];
    var mx = 0; hourly.forEach(function (h) { mx = Math.max(mx, h.inflow, h.outflow); });
    var n = hourly.length || 48, bw = 100 / n, inP = '', outP = '';
    hourly.forEach(function (h, i) {
      var x = (i * bw + bw * 0.15).toFixed(3), w = (bw * 0.7).toFixed(3);
      if (mx > 0 && h.inflow > 0) { var hi = Math.max(0.3, h.inflow / mx * 19); inP += 'M' + x + ' ' + (20 - hi).toFixed(3) + 'h' + w + 'v' + hi.toFixed(3) + 'h-' + w + 'z'; }
      if (mx > 0 && h.outflow > 0) { var ho = Math.max(0.3, h.outflow / mx * 19); outP += 'M' + x + ' 20h' + w + 'v' + ho.toFixed(3) + 'h-' + w + 'z'; }
    });
    var hh = function (ms) { return new Date(ms).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }); };
    var chart = { inPath: inP || 'M0 0', outPath: outP || 'M0 0', top: mx ? this.money(mx) : '', bottom: mx ? '-' + this.money(mx) : '',
      empty: !mx, emptyText: ok ? 'No deposits or withdrawals recorded in the last 48 hours yet.' : 'Hourly flows appear when the server is running.',
      from: hourly.length ? hh(hourly[0].t) : '48 h ago', mid: hourly.length ? hh(hourly[Math.floor(hourly.length / 2)].t) : '24 h ago' };

    // leaderboard
    var all = ok ? ov.casinos.filter(function (c) { return c.wallets > 0; }) : [];
    var isQuiet = function (c) { return !(c.inflow || c.outflow); };
    var quietN = all.filter(isQuiet).length;
    var list = all.filter(function (c) { return !isQuiet(c); });
    var key = st.sort;
    list.sort(function (a, b) { return key === 'net' ? b.net - a.net : (b[key] - a[key]) || (b.balance - a.balance); });
    var maxNet = 0; list.forEach(function (c) { maxNet = Math.max(maxNet, Math.abs(c.net)); });
    var quietRows = all.filter(isQuiet).sort(function (a, b) { return b.balance - a.balance; });
    if (st.showQuiet || !list.length) list = list.concat(quietRows);
    var rows = list.map(function (c, i) {
      var f = maxNet ? Math.min(1, Math.abs(c.net) / maxNet) * 50 : 0;
      return { rank: i + 1, name: c.name, href: 'Wallets.dc.html?c=' + c.slug, ini: self.ini(c.name), tint: self.tint(c.name), logo: self.logo(self.domainOf(c.slug), 64),
        meta: (c.depositors ? c.depositors.toLocaleString('en-US') + (c.depositors === 1 ? ' depositor · ' : ' depositors · ') : '') + (c.chains.map(function (x) { return x.name; }).join(', ') || 'No activity yet'),
        inflow: isQuiet(c) ? '–' : self.money(c.inflow), outflow: isQuiet(c) ? '–' : self.money(c.outflow), net: isQuiet(c) ? 'quiet' : (c.net >= 0 ? '+' : '') + self.money(c.net), netColor: c.net >= 0 ? green : orange,
        barL: (c.net >= 0 ? 50 : 50 - f).toFixed(1) + '%', barW: f.toFixed(1) + '%', balance: self.money(c.balance) };
    });

    // whales
    var wl = ok && st.wh ? st.wh.items.filter(function (w) { return st.wdir === 'all' || w.dir === st.wdir; }) : [];
    var whales = wl.map(function (w) {
      var inn = w.dir === 'in';
      return { name: w.name, kind: inn ? 'deposit' : 'withdrawal', url: w.txUrl, usd: self.money(w.usd), color: inn ? green : orange, ago: self.ago(w.ts),
        detail: self.amt(w.amount) + ' ' + w.asset + ' on ' + w.chainName + (w.cp ? ' · ' + (inn ? 'from ' : 'to ') + self.short(w.cp) : ''),
        iconBg: inn ? 'rgba(14,124,102,0.1)' : 'rgba(194,65,12,0.1)', iconFg: inn ? green : orange, arrow: inn ? 'M12 5v14M5 12l7 7 7-7' : 'M12 19V5M5 12l7-7 7 7' };
    });

    // tokens
    var tks = st.tk && st.tk.tokens ? st.tk.tokens : [];
    var tokens = tks.map(function (k) {
      var hc = k.holders != null && k.holders7d != null ? k.holders - k.holders7d : null;
      return { sym: k.sym, name: k.name, url: k.dexUrl || k.url, ini: k.sym.slice(0, 2), tint: self.tint(k.sym), logo: self.tokLogo(k.sym),
        price: k.price != null ? self.price(k.price) : 'n/a', ch: k.ch24 != null ? self.pct(k.ch24) : '', chColor: self.pcol(k.ch24 || 0),
        liq: k.liquidity != null ? self.money(k.liquidity) : 'n/a', vol: k.vol24 != null ? self.money(k.vol24) : 'n/a',
        buys: k.buys24 != null ? k.buys24.toLocaleString('en-US') : '', sells: k.sells24 != null ? k.sells24.toLocaleString('en-US') : '', sep: k.buys24 != null || k.sells24 != null ? ' / ' : 'n/a',
        holders: k.holders != null ? k.holders.toLocaleString('en-US') : 'n/a', hCh: hc == null ? (k.holders != null ? '7d change soon' : '') : (hc >= 0 ? '+' : '') + hc.toLocaleString('en-US') + ' in 7d', hColor: hc == null ? '#74748A' : self.pcol(hc),
        burned: k.burned7d != null ? self.amt(k.burned7d) + ' ' + k.sym : 'after 7 days',
        treasury: k.treasury ? self.amt(k.treasury) + ' ' + k.sym : '0 ' + k.sym, treasuryUsd: k.treasuryUsd ? self.money(k.treasuryUsd) : 'in tracked wallets' };
    });
    if (!tokens.length) tokens = [{ sym: 'RLB', name: 'Rollbit', url: 'https://etherscan.io/token/0x046EeE2cc3188071C02BfC1745A6b17c656e3f3d' }, { sym: 'SHFL', name: 'Shuffle', url: 'https://etherscan.io/token/0x8881562783028F5c1BCB985d2283D5E170D88888' }].map(function (k) {
      return { sym: k.sym, name: k.name, url: k.url, ini: k.sym.slice(0, 2), tint: self.tint(k.sym), logo: self.tokLogo(k.sym), price: 'Waiting', ch: '', chColor: '#74748A', liq: 'Waiting', vol: 'Waiting', buys: '', sells: '', sep: 'Waiting', holders: 'Waiting', hCh: '', hColor: '#74748A', burned: 'Waiting', treasury: 'Waiting', treasuryUsd: '' };
    });

    var cov = D.coverage.map(function (c) { return { name: c.name, n: c.n, href: 'Wallets.dc.html?c=' + c.slug, ini: self.ini(c.name), tint: self.tint(c.name), logo: self.logo(self.domainOf(c.slug), 64) }; });
    var nW = D.coverage.reduce(function (s, c) { return s + c.n; }, 0);

    return Object.assign(v, {
      stc: stc, statusLine: statusLine, hasNotice: !!notice, notice: notice || { title: '', body: '' },
      wins: this.seg([{ v: '24h', label: '24h' }, { v: '7d', label: '7d' }, { v: '30d', label: '30d' }], st.win, function (k) { if (k !== '24h' && self.locked()) { self.gate('7-day and 30-day history'); return; } self.setState({ win: k }); self.pull(k); }),
      openHow: function () { self.setState({ modal: 'how' }); },
      csv: function () { if (self.locked()) { self.gate('CSV downloads'); return; } location.href = '/api/onchain/export/flows.csv?window=' + st.win; },
      kpis: kpis, chart: chart,
      sorts: this.seg([{ v: 'inflow', label: 'Deposits' }, { v: 'outflow', label: 'Withdrawals' }, { v: 'net', label: 'Net' }, { v: 'balance', label: 'Balance' }], st.sort, function (k) { self.setState({ sort: k }); }),
      boardSub: 'Last ' + winLabel + ', in US dollars at current prices.',
      rows: rows, rowsEmpty: rows.length === 0, quietToggle: quietN > 0 && quietN < all.length,
      quietLabel: st.showQuiet ? 'Hide quiet casinos' : 'Show ' + quietN + ' quiet casino' + (quietN === 1 ? '' : 's') + ' (no flows in this window)', toggleQuiet: function () { self.setState({ showQuiet: !st.showQuiet }); },
      rowsEmptyText: ok ? 'No tracked casino has moved funds in this window yet.' : 'The leaderboard ranks every tracked casino by deposits, withdrawals, net flow and balance once the server is running.',
      boardFoot: 'Counts transfers into and out of each casino\'s tracked wallets. Transfers between a casino\'s own wallets are excluded. Spam tokens are ignored; only USDT, USDC, DAI, ETH, BNB, POL, TRX, SOL, BTC and the casinos\' own tokens count.',
      wdot: ok ? 'pulse' : '', wdotColor: ok ? '#E11D48' : '#C6C6D2',
      whaleSub: ok ? 'Updates every minute' : 'Live with the server',
      wdirs: this.seg([{ v: 'all', label: 'All' }, { v: 'in', label: 'Deposits' }, { v: 'out', label: 'Withdrawals' }], st.wdir, function (k) { self.setState({ wdir: k }); }),
      wmins: this.seg([{ v: 50000, label: '$50K+' }, { v: 250000, label: '$250K+' }, { v: 1000000, label: '$1M+' }], st.wmin, function (k) { self.setState({ wmin: k }); self.pull(null, k); }),
      whales: whales, whalesEmpty: whales.length === 0,
      whalesEmptyText: ok ? 'No transfer above ' + this.money(st.wmin) + ' recorded yet.' : 'Every deposit or withdrawal above $50K shows here within minutes, with a link to the transaction. The server can also post them to Telegram.',
      whaleFoot: 'Click a row to open the transaction on the block explorer.',
      tokens: tokens,
      tokenFoot: 'Supply and burns from the token contract on Ethereum, holders from Ethplorer, liquidity and trades from DexScreener. Burn history starts the day the server starts.',
      coverage: cov,
      covSub: D.coverage.length + ' casinos, ' + nW + ' Ethereum wallets from Etherscan public name tags. Same-address balances on BNB Chain and Polygon are read too.',
      covFoot: 'Tron, Solana and Bitcoin wallets are added with the wallet tool: you follow one small deposit to the casino\'s collection wallet. Addresses are public blockchain data; labels come from Etherscan or from your own deposit trace.',
      openAdd: function () { self.setState({ modal: 'add' }); },
      isHow: st.modal === 'how', isAdd: st.modal === 'add', canAdmin: !!(this.props && this.props.$local), noAdmin: !(this.props && this.props.$local),
      how: [
        { n: '1', t: 'Wallets.', b: 'Each casino\'s wallets are listed with their source. Ethereum addresses come from Etherscan public name tags such as "Stake.com" or "Roobet: Hot Wallet". More are added by tracing a deposit.' },
        { n: '2', t: 'Deposits and withdrawals.', b: 'Every few minutes the server reads new transfers for each wallet: Etherscan for Ethereum and Polygon, TronGrid for Tron, a Solana RPC node for Solana and mempool.space for Bitcoin. Money arriving counts as a deposit, money leaving as a withdrawal.' },
        { n: '3', t: 'Internal moves are removed.', b: 'When a casino moves money between two of its own tracked wallets, it is not counted, so flows are not doubled.' },
        { n: '4', t: 'Only real assets count.', b: 'Hot wallets receive thousands of fake tokens. Only USDT, USDC, DAI, the native coins and the casinos\' own tokens are counted, matched by contract address, never by name.' },
        { n: '5', t: 'Dollar values.', b: 'Stablecoins count as one dollar. Other assets use the DefiLlama price at the time the transfer is read.' },
        { n: '6', t: 'Depositors.', b: 'The number of different addresses that sent money into a casino\'s tracked wallets. For hot wallets these are mostly the personal deposit addresses casinos give each player.' },
        { n: '7', t: 'What it does not see.', b: 'Casinos also use wallets that are not labeled yet, so these totals are a floor, not the full picture. Deposit addresses sweep into collection wallets, so one sweep can bundle several player deposits.' }
      ],
      addSteps: [
        { n: '1', t: 'Get a deposit address.', b: 'Open the casino, choose deposit, pick the coin and network (for example USDT on Tron) and copy the address it shows you.' },
        { n: '2', t: 'Send a small deposit.', b: 'Send a small amount. Within minutes the casino sweeps it from that address into its own collection or hot wallet.' },
        { n: '3', t: 'Trace it.', b: 'Paste the deposit address into the wallet tool. It shows where the funds went and suggests the casino wallet.' },
        { n: '4', t: 'Add it.', b: 'Confirm the casino and save. The server starts tracking it on the next run. The tool needs the admin token set on the server.' }
      ]
    });
  }

}
</script>
