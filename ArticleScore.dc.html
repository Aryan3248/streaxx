<p class="ax-lead">The Streax Score rates a crypto casino from 0 to 100. It combines what the blockchain shows, what players report and what we check by hand. Every category names its source, and a category without enough evidence is left out instead of guessed.</p>

<h2>The nine categories</h2>
<div class="ax-table"><table>
<thead><tr><th>Category</th><th>Weight</th><th>Source</th><th>What it measures</th></tr></thead>
<tbody>
<tr><td>On-chain activity</td><td>15</td><td>On-chain</td><td>Deposit volume and how many wallets deposit.</td></tr>
<tr><td>Reserves</td><td>15</td><td>On-chain</td><td>Hot wallet money compared with a day of deposits.</td></tr>
<tr><td>Payout speed</td><td>15</td><td>Players</td><td>Median time from withdrawal request to coins arriving, from verified reports.</td></tr>
<tr><td>Complaint record</td><td>15</td><td>Players</td><td>Share of closed complaints the casino resolved.</td></tr>
<tr><td>Fairness and RTP</td><td>10</td><td>Review</td><td>Provably fair games, a verifier, client seeds and published RTP.</td></tr>
<tr><td>Licence and compliance</td><td>10</td><td>Review</td><td>A licence we could check, KYC timing, geo-blocking and AML policy.</td></tr>
<tr><td>Responsible gambling</td><td>8</td><td>Review</td><td>Self-exclusion, limits, cool-off and help links.</td></tr>
<tr><td>Support</td><td>7</td><td>Review</td><td>24/7 live help and how fast a person answers.</td></tr>
<tr><td>Account security</td><td>5</td><td>Review</td><td>Two-factor login, withdrawal confirmation and login alerts.</td></tr>
</tbody></table></div>
<p>Each category is scored from 0 to 10. The total is the weighted average of the categories we could rate, scaled to 100.</p>

<h2>On-chain activity and reserves</h2>
<p><b>Activity</b> blends deposit volume (57%) and the number of depositing wallets (43%). Both are compared on a log scale against the biggest casino in the list, so a casino does not need Stake-sized volume to score well, but a near-empty one cannot score high either. Casinos with under $1,000 of deposits in 24 hours are not scored at all.</p>
<p><b>Reserves</b> compare the hot wallet balance with one day of deposits:</p>
<ul>
<li>no reserves scores 0, a quarter of a day scores 2</li>
<li>one full day of deposits scores 5, two days 7</li>
<li>five days or more scores the full 10</li>
</ul>
<p>When the Streax monitor tracks a casino's wallets, a fall of more than 40% from the 7-day high costs up to 4 points. Withdrawals tend to slow down when hot wallets run low.</p>
<p>Hot wallets are working capital the casino moves every day, not player funds held in trust. A low reserve is a warning sign, not proof of trouble.</p>

<h2>Payout speed and complaints</h2>
<p><b>Payout speed</b> uses the median time from withdrawal request to coins arriving, across verified payout reports from the last 90 days. It needs at least 3 reports before it counts. Ten minutes or less scores 10, an hour scores 8, three hours 6, a day 2 and two days or more 0.</p>
<p><b>Complaint record</b> is the share of closed complaints the casino resolved. It needs at least 3 closed complaints. Rejected complaints never count against a casino, and open ones are not counted until they close.</p>
<p>Both come from Streax members. A payout report counts straight away when the transaction left a wallet we know belongs to that casino; otherwise we check it by hand first.</p>

<h2>Our review categories</h2>
<p>The five review categories come from checks a person does on the casino's site. Each check is marked yes, no or not checked. A category needs most of its checks answered before it is scored:</p>
<ul>
<li><b>Fairness and RTP:</b> 5 checks, at least 3 answered.</li>
<li><b>Licence and compliance:</b> a licence confirmed with the regulator scores 10, a licence that is claimed but not yet confirmed scores 7, no licence scores 0. This counts for 60%, and four compliance checks count for 40%.</li>
<li><b>Responsible gambling:</b> 5 checks, at least 3 answered.</li>
<li><b>Support:</b> 24/7 live chat with a person scores 10 (3 without it), and the time to a first human reply adds a second score.</li>
<li><b>Account security:</b> 3 checks, at least 2 answered.</li>
</ul>

<h2>Early and provisional scores</h2>
<p>A score is only shown once categories worth at least 25% of the weight are rated. Below half of the weight it is labeled <b>Early score</b>, and below 80% it is marked <b>provisional</b>. This stops a casino with one good number from looking excellent.</p>

<h2>Grades</h2>
<div class="ax-table"><table>
<thead><tr><th>Score</th><th>Grade</th></tr></thead>
<tbody>
<tr><td>85 to 100</td><td>Excellent</td></tr>
<tr><td>70 to 84</td><td>Good</td></tr>
<tr><td>55 to 69</td><td>Fair</td></tr>
<tr><td>40 to 54</td><td>Weak</td></tr>
<tr><td>Under 40</td><td>Poor</td></tr>
</tbody></table></div>

<h2>What the score is not</h2>
<p>It is not a promise that a casino will pay, and it is not financial advice. On-chain figures only cover wallets we can identify, so they are a floor. Casinos can change their terms, owners and wallets at any time. Use the score as a starting point, read the complaints and payout reports behind it, and never deposit more than you can afford to lose.</p>

class Component extends DCLogic {

  showToast(msg) {
    var self = this;
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(function () { self.setState({ toast: '' }); }, 2600);
  }
  copy(text, msg) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {}
    this.showToast(msg);
  }
  money(v) {
    if (v == null || isNaN(v)) return 'n/a';
    var a = Math.abs(v), s = v < 0 ? '-' : '', o;
    if (a >= 1e9) o = (a / 1e9).toFixed(2) + 'B';
    else if (a >= 1e6) o = (a / 1e6).toFixed(2) + 'M';
    else if (a >= 1e3) o = (a / 1e3).toFixed(2) + 'K';
    else if (a >= 1) o = a.toFixed(2);
    else if (a === 0) o = '0';
    else o = a.toPrecision(3);
    return s + '$' + o;
  }
  compact(v) {
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return String(Math.round(v));
  }
  price(v) {
    if (v >= 1000) return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (v >= 1) return '$' + v.toFixed(2);
    return '$' + v.toPrecision(4);
  }
  pct(v) { return (v >= 0 ? '▲ ' : '▼ ') + Math.abs(v).toFixed(2) + '%'; }
  pcol(v) { return v >= 0 ? '#0E7C66' : '#C2410C'; }
  seg(opts, active, pick) {
    return opts.map(function (o) {
      var on = o.v === active;
      return { label: o.label, v: o.v, on: on, bg: on ? '#FFFFFF' : 'transparent', shadow: on ? 'inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 1px #DCDCE4' : 'none', fg: on ? '#16141F' : '#6B6B78', pick: function () { pick(o.v); } };
    });
  }
  tint(name) {
    var t = ['linear-gradient(135deg, #EAF1FF, #D9E6FF)', 'linear-gradient(135deg, #E6F5FF, #D3EAFE)', 'linear-gradient(135deg, #EFECFF, #E0DBFF)', 'linear-gradient(135deg, #E8F4FA, #D7EAF5)', 'linear-gradient(135deg, #EEF2F9, #DFE6F2)'];
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
