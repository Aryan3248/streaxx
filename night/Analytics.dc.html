        label: i < 8 || on ? c.name : '', aria: c.name + ': ' + c.depS + ' deposits, ' + c.hotS + ' hot wallet', pick: function () { self.setState({ pick: c.slug }); } };
    });
    var payR = pickC.pay == null ? 'n/a' : (pickC.pay / pickC.dep * 100).toFixed(1) + '%';
    return Object.assign(v, {
      mkChip: this.liveChip(lm.market ? 1 : 0, 'Prices · snapshot 12 Oct'), market: market,
      share: function () { var u = typeof location !== 'undefined' ? location.href : 'Analytics'; self.copy(u, 'Link to this page copied'); },
      kpis: [
        { label: 'Deposits 24h', value: T.dep, sub: T.deposits + ' deposits' },
        { label: 'Depositing wallets', value: T.wallets, sub: 'Unique wallets, 24h' },
        { label: 'Average deposit', value: this.money(T.depN / T.depositsN), sub: 'Deposits divided by count' },
        { label: 'Casinos tracked', value: String(T.operators), sub: 'Top 12 hold ' + (top12share / totDep * 100).toFixed(0) + '% of deposits' }
      ],
      tokChip: this.liveChip(lm.tokens || 0, 'Snapshot 12 Oct'),
      ranges: this.seg([{ v: 7, label: '7D' }, { v: 14, label: '14D' }, { v: 30, label: '30D' }], st.range, function (k) { self.setState({ range: k, hover: null }); }),
      legend: legend, lines: lines, ends: ends, yTicks: yTicks,
      xTicks: [0, 1, 2, 3, 4].map(function (k) { return dateOf(Math.round(k * (n - 1) / 4)); }),
      chartAria: 'Percent change of ' + toks.length + ' casino tokens over ' + n + ' days',
      chartMove: function (e) { var el = e.currentTarget; if (!el || !el.getBoundingClientRect) return; var r = el.getBoundingClientRect(), wd = r.width - 96; if (wd <= 0) return; var i = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / wd)) * (n - 1)); if (i !== self.state.hover) self.setState({ hover: i }); },
      chartLeave: function () { self.setState({ hover: null }); },
      hasHover: hv != null, tipX: 'calc((100% - 96px) * ' + frac.toFixed(4) + ')', tipShift: frac > 0.5 ? 'translateX(calc(-100% - 14px))' : 'translateX(14px)',
      tipDate: hv != null ? dateOf(hv) : '', tipRows: tipRows,
      shareRows: shareRows, shareFoot: 'Top 12 of ' + D.casinos.length + ' casinos.' + (D.liveOnly ? ' All live from the Streax on-chain monitor (tracked wallets only).' : D.live ? ' Casinos marked live use the Streax monitor (tracked wallets only), the rest the 12 Oct snapshot.' : '') + ' Click a casino to open its profile.',
      shareBadge: D.liveOnly ? 'Live on-chain' : D.live ? 'Live + snapshot' : 'Reference snapshot',
      chainFoot: D.liveOnly ? 'Live balances of the wallets Streax tracks, at current prices.' : D.live ? 'Live balances of tracked wallets for casinos marked live. Other casinos show their published split at late August 2026 prices.' : '18 casinos with a published chain split. Asset values match late August 2026 prices.',
      chainLegend: [['Ethereum', '#B49CFF'], ['Solana', '#A78BFA'], ['Tron', '#FB7185'], ['BNB', '#FCD34D']].map(function (x) { return { label: x[0], color: x[1] }; }),
      chainRows: chainRows,
      gridX: [3, 4, 5, 6, 7, 8].map(function (e) { return { left: 'calc(56px + (100% - 68px) * ' + ((e - x0) / (x1 - x0)).toFixed(4) + ')', label: '$' + ['1K', '10K', '100K', '1M', '10M', '100M'][e - 3] }; }),
      gridY: [4, 5, 6, 7, 8, 9].map(function (e) { return { top: 'calc(12px + (100% - 46px) * ' + (1 - (e - y0) / (y1 - y0)).toFixed(4) + ')', label: '$' + ['10K', '100K', '1M', '10M', '100M', '1B'][e - 4] }; }),
      dots: dots,
      pickC: { name: pickC.name, ini: this.ini(pickC.name), tint: this.tint(pickC.name), logo: this.logo(pickC.domain || pickC.slug, 64), href: 'Casino.dc.html?c=' + pickC.slug,
        rows: [{ label: 'Deposits 24h', value: pickC.depS }, { label: 'Hot wallet', value: pickC.hotS }, { label: 'Hot wallet ÷ deposits', value: (pickC.hot / pickC.dep).toFixed(1) + '×' }, { label: 'Payout ratio', value: payR }] }
    });
  }

}
