[build]
  publish = "."
  command = "npm install --omit=dev"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep server code and tooling out of the public site.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

# Old article addresses go to the article pages.
[[redirects]]
  from = "/articles"
  to = "/Articles.dc.html"
  status = 301
  force = true

[[redirects]]
  from = "/articles/"
  to = "/Articles.dc.html"
  status = 301
  force = true

