services:
  - type: web
    name: streax
    runtime: node
    plan: 0.5c-512mb
    buildCommand: echo "No build step needed"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: streax-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NO_OPEN
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: WHALE_USD
        value: "50000"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
