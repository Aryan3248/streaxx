<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Streax Studio</title>
<link rel="icon" type="image/png" href="assets/streax-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/studio/base.css">
<script src="/studio/markdown.js"></script>
<script src="/studio/score.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accentInk)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.sub{color:var(--sub)}
.muted{color:var(--muted)}
/* sign in */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--rootBg)}
.gate .box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:30px}
.gate h1{margin:14px 0 6px;font-size:36px;line-height:1.05}
/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:32px;height:32px;border-radius:10px}
.brand b{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;line-height:1}
.brand span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accentInk);background:var(--accentA);padding:2px 7px;border-radius:6px}
.navb{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:11px;background:transparent;color:var(--sub);font-weight:500;cursor:pointer;text-align:left;text-decoration:none}
.navb:hover{background:var(--soft);color:var(--ink)}
.navb[aria-current=page]{background:var(--accentA);color:var(--accentInk)}
.navb svg{flex:0 0 auto}
.navb .count{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.navlabel{margin:14px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.main{min-width:0;padding:22px 28px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:34px;line-height:1.05}
.head p{margin:4px 0 0;color:var(--sub)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accentB)}
.btn.primary{border:0;background:var(--primary);color:#fff;font-weight:600;box-shadow:0 10px 24px -14px rgba(36,66,214,.8)}
.btn.danger{color:var(--bad)}
.btn.good{border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:36px;height:36px;padding:0;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:var(--soft);border:1px solid var(--line)}
.tab{min-height:34px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,64,.08)}
.tab .n{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=url],input[type=number],input[type=password],input[type=datetime-local],select,textarea{width:100%;min-height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);outline:none}
textarea{padding:10px 12px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentA)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:var(--sub);min-width:0}
label.f .hint{font-weight:400;color:var(--muted)}
.counter{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--muted);margin-left:auto}
.counter.warn{color:var(--warn)}.counter.bad{color:var(--bad)}.counter.good{color:var(--good)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--goodA);color:var(--good)}.p-warn{background:var(--warnA);color:var(--warn)}.p-bad{background:var(--badA);color:var(--bad)}.p-accent{background:var(--accentA);color:var(--accentInk)}.p-muted{background:var(--soft);color:var(--muted)}
.thumb{width:64px;height:40px;border-radius:9px;object-fit:cover;background:#2442D6 url(/assets/streax-card.webp) center/cover;flex:0 0 auto;display:block}
.empty{padding:48px 20px;text-align:center;color:var(--sub)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ed-title{border:0 !important;box-shadow:none !important;background:transparent !important;padding:0 !important;font-family:'Instrument Serif',Georgia,serif;font-size:44px !important;line-height:1.08;min-height:56px !important;resize:none;overflow:hidden}
.ed-dek{border:0 !important;box-shadow:none !important;background:transparent !important;padding:0 !important;font-size:18px;color:var(--sub);resize:none;overflow:hidden;min-height:30px !important}
.mdbox{border:1px solid var(--border);border-radius:16px;background:var(--card);overflow:hidden}
.mdbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentA)}
.toolbar{display:flex;gap:2px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:0;z-index:5}
.tb{min-width:34px;height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.tb:hover{background:var(--card);color:var(--ink)}
.tbsep{width:1px;background:var(--line);margin:4px 4px}
#body{border:0;box-shadow:none;border-radius:0;min-height:560px;font-family:'Geist Mono',ui-monospace,monospace;font-size:14px;line-height:1.75;padding:16px 18px;background:var(--card)}
.mdfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--soft)}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
.panel{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.panel .ptabs{padding:10px;border-bottom:1px solid var(--line)}
.panel .pbody{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.preview{font-size:15.5px}
.preview .prose{font-size:15.5px}
.preview .prose h2{font-size:23px}
.preview .prose .callout{font-size:14.5px}
.preview .prose blockquote{font-size:21px}
.preview h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.08;margin:6px 0 8px}
.preview .pdek{color:var(--sub);margin:0 0 14px;font-size:16px}
.preview .pcover{width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:14px;margin-bottom:16px;display:block}
.cover-drop{border:1.5px dashed var(--border);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--sub);cursor:pointer;position:relative;overflow:hidden;background:var(--soft)}
.cover-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-drop:hover{border-color:var(--accent)}
.cover-actions{display:flex;gap:6px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:12.5px;font-weight:500;cursor:pointer}
.chipb[aria-pressed=true]{background:var(--accentA);border-color:var(--accentB);color:var(--accentInk)}
.serp{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.serp .u{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serp .ti{font-size:18px;line-height:1.3;color:#1a0dab;margin:4px 0 3px}
[data-theme=night] .serp .ti{color:#8ab4f8}
.serp .de{font-size:13.5px;line-height:1.5;color:var(--body)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;margin-top:1px}
.dot.ok{background:var(--good)}.dot.no{background:var(--warn)}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:10px;z-index:20;margin-bottom:14px}
.state{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.state.dirty{color:var(--warn)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.switch input{width:38px;height:22px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* complaints */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fact{padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.fact span{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-weight:600;font-size:14px;word-break:break-word}
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ev{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.ev.casino{border-color:var(--accentB);background:var(--accentA)}
.ev.streax{background:var(--soft)}
.ev.priv{border-style:dashed;border-color:var(--warn)}
.evh{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.evh b{color:var(--ink)}
.ev p{margin:6px 0 0;white-space:pre-wrap;line-height:1.55}
.linkbox{display:flex;gap:6px}
.linkbox input{font-family:'Geist Mono',monospace;font-size:12px}
/* reviews */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:0 0 auto}
.seg button{min-height:30px;padding:0 10px;border:0;border-left:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;color:var(--sub);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true].y{background:var(--goodA);color:var(--good)}
.seg button[aria-pressed=true].n{background:var(--badA);color:var(--bad)}
.seg button[aria-pressed=true].u{background:var(--soft);color:var(--ink)}
.checkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:0}
.grp h3{margin:0 0 4px;font-size:16px}
.grp{padding:18px}
.scorebig{font-family:'Geist Mono',monospace;font-size:44px;font-weight:500;letter-spacing:-.02em;line-height:1}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.mobile-top{display:none}
@media (max-width:1180px){.ed{grid-template-columns:minmax(0,1fr)}.panel{position:static;max-height:none}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.side.open{display:flex;position:fixed;inset:0;z-index:60;height:100%;width:280px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}.mobile-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:30}.main{padding:16px 16px 60px}.head h1{font-size:28px}.ed-title{font-size:34px !important}.grid2{grid-template-columns:1fr}.hide-s{display:none}}
</style>
</head>
<body>
<div id="gate" class="gate hidden">
  <form class="box" id="gate-form" autocomplete="off">
    <div class="row" style="gap:10px"><img src="assets/streax-logo.webp" alt="" width="36" height="36" style="border-radius:11px"><span class="serif" style="font-size:28px">Streax</span></div>
    <h1 class="serif">Studio</h1>
    <p class="sub" style="margin:0 0 18px">Write articles, check complaints, verify payout reports and review casinos.</p>
    <label class="f">Admin token<input id="gate-token" type="password" required placeholder="The ADMIN_TOKEN value from your server" autocomplete="current-password"></label>
    <p id="gate-err" class="hidden" role="alert" style="color:var(--bad);font-size:13.5px;margin:10px 0 0"></p>
    <button class="btn primary" type="submit" style="width:100%;margin-top:14px;min-height:46px">Open the Studio</button>
    <p class="muted" style="font-size:12.5px;margin:14px 0 0">The token stays in this browser tab only. Close the tab to sign out.</p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side" aria-label="Studio">
    <div class="brand"><img src="assets/streax-logo.webp" alt=""><b>Streax</b><span>Studio</span></div>
    <button class="navb" data-go="articles"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Articles</button>
    <button class="navb" data-go="complaints"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v3M12 13.5v.01"/></svg>Complaints<span class="count hidden" id="n-complaints"></span></button>
    <button class="navb" data-go="payouts"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Payout reports<span class="count hidden" id="n-payouts"></span></button>
    <button class="navb" data-go="reviews"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Casino reviews</button>
    <div class="navlabel">More tools</div>
    <a class="navb" href="/onchain-admin.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.6 3 6"/></svg>Members, codes and wallets</a>
    <a class="navb" href="/articles" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>View the site</a>
    <div class="foot">
      <button class="navb" id="theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Night mode</span></button>
      <button class="navb" id="signout"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Sign out</button>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="mobile-top"><button class="btn iconbtn" id="menu" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b class="serif" style="font-size:22px">Streax Studio</b></div>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var TOKEN = '';
  try { TOKEN = sessionStorage.getItem('sx_admin') || ''; } catch (e) {}
  var META = { categories: [], casinos: [], base: '' };
  var TRUST = null;
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view');

  // ---------- tiny DOM helper: text is always set as text, never parsed as HTML ----------
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v; // only used with our own SVG/markdown output
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (k === 'style') n.setAttribute('style', v);
      else if (k in n && typeof v !== 'string') n[k] = v;
      else n.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(n, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(n, x); }); return; }
    n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  var toastT;
  function toast(msg, err) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast hidden'; }, err ? 5200 : 2800);
  }
